<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="#4299e1"/>
  
  <!-- Query symbol -->
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">?</text>
  
  <!-- Parameter symbol (equals sign) - centered vertically with the question mark -->
  <line x1="18" y1="20" x2="30" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="26" x2="30" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
